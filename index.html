<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>华诚 · 涉外法律服务</title>
<!--
  ============================================================
  华诚涉外法律简介 · H5 单页（中 / 英 双语切换版）
  ——— 可修改说明 ———
  1) 改文字：改下面 <script> 里的 I18N 字典（zh 中文 / en 英文），
     不要直接改 <section> 里的文字——那里只有占位，会被字典覆盖。
  2) 改配色：改下面 :root 里的 CSS 变量（--bg / --teal / --green 等）。
  3) 改 logo：首屏品牌标记用 logo_mark_teal.png（青绿单色 WB 徽标），
     要换图直接替换该 src 即可。
  4) 改语言：点右上角「EN / 中」按钮，或用 I18N 字典增删语种。
  ============================================================
-->
<style>
@font-face{
  font-family:'FangYuan';
  src:url('FangYuanThin.woff2') format('woff2');
  font-weight:200 700;font-display:swap;
}
:root{
  --bg:#E7E8E8;          /* 页面底色（浅灰） */
  --bg-soft:#DCDCDC;     /* 次级底 */
  --teal:#90A8A8;        /* 墨绿青灰 */
  --teal-light:#C8DCDC;  /* 浅青 */
  --green:#90C0A8;       /* 柔绿 */
  --green-light:#DCF0DC; /* 浅绿 */
  --ink:#333333;         /* 主文字（深） */
  --ink-soft:#4A4A4A;    /* 正文 */
  --line:rgba(26,26,26,.12);
  --card:rgba(255,255,255,.66);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'FangYuan',"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;font-weight:350;
  color:var(--ink-soft);background:var(--bg);line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
/* 竖向滚动 + 逐屏吸附，营造 H5 观感 */
.scroll{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{display:none}
section{
  min-height:100vh;scroll-snap-align:start;position:relative;
  display:flex;flex-direction:column;justify-content:center;
  padding:64px 28px 72px;overflow:hidden;
}
/* 抽象油画感背景：分层渐变，无需图片，加载快、可改色 */
.bg{position:absolute;inset:0;z-index:0}
.bg::before,.bg::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
.bg::before{width:78vw;height:78vw;left:-22vw;top:-18vw;
  background:radial-gradient(circle at 30% 30%,var(--teal-light),transparent 70%)}
.bg::after{width:70vw;height:70vw;right:-20vw;bottom:-16vw;
  background:radial-gradient(circle at 60% 60%,var(--green-light),transparent 70%)}
.layer{position:relative;z-index:1;max-width:480px;margin:0 auto;width:100%}

/* 顶部进度条 */
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:30;
  background:linear-gradient(90deg,var(--teal),var(--green));transition:width .15s}

/* 右上角语言切换 */
#lang{
  position:fixed;top:14px;right:14px;z-index:40;
  display:flex;align-items:center;gap:2px;
  background:rgba(255,255,255,.90);border:1px solid rgba(144,168,168,.60);
  border-radius:999px;padding:4px;backdrop-filter:blur(6px);
  box-shadow:0 4px 14px rgba(40,60,55,.12);
}
#lang button{
  font-family:inherit;font-size:12.5px;letter-spacing:1px;font-weight:400;
  color:var(--teal);background:transparent;border:0;border-radius:999px;
  padding:6px 12px;cursor:pointer;transition:.2s;line-height:1.2;
}
#lang button.on{background:var(--teal);color:#fff}

/* 右侧导航点 */
#nav{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:30;
  display:flex;flex-direction:column;gap:11px}
#nav a{width:8px;height:8px;border-radius:50%;background:rgba(26,26,26,.25);transition:.25s}
#nav a.on{background:var(--teal);transform:scale(1.5)}

/* 品牌标识 */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.brand-emblem{width:46px;height:46px;object-fit:contain;display:block;flex:none}
.brand-en{font-size:13px;letter-spacing:2px;color:var(--ink);font-weight:400}
.brand-cn{font-size:13px;letter-spacing:4px;color:var(--teal)}

.kicker{font-size:13px;letter-spacing:3px;color:var(--teal);margin-bottom:14px}
.poem{font-family:'FangYuan',"Songti SC",serif;font-size:30px;line-height:1.45;
  color:var(--ink);font-weight:400;letter-spacing:1px;margin-bottom:10px}
.sub{font-size:15px;color:var(--ink-soft);letter-spacing:1px}
.lead{font-size:15px;color:var(--ink-soft);margin-top:18px}

/* 首屏：参照原 PDF 首屏的不对称构图 */
.hero{position:relative;justify-content:flex-start;padding-top:54px}
.hero .brand{position:relative;z-index:3;margin:0 0 0 2px}
.hero-layer{text-align:left;margin-top:auto;margin-bottom:auto}
.hero-layer .kicker,.hero-layer .poem,.hero-layer .sub{text-align:left}
.skyline{position:absolute;left:0;bottom:0;width:100%;height:34vh;color:var(--teal);
  opacity:.38;z-index:1;pointer-events:none}

h2{font-family:'FangYuan',"Songti SC",serif;font-size:24px;color:var(--ink);
  margin-bottom:6px;letter-spacing:1px}
.sec-tag{font-size:12px;letter-spacing:3px;color:var(--teal);margin-bottom:22px}

/* 卡片列表 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px 18px;margin-bottom:14px;backdrop-filter:blur(6px)}
.card .h{font-size:17px;color:var(--ink);font-weight:400;margin-bottom:4px}
.card .t{font-size:13px;color:var(--teal);font-style:italic;margin-bottom:8px;
  font-family:'FangYuan',"Songti SC",serif}
.card p{font-size:14px;color:var(--ink-soft)}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:1fr 1fr}
.feat{text-align:center;padding:20px 10px;background:var(--card);border:1px solid var(--line);
  border-radius:16px}
.feat .n{font-size:18px;color:var(--ink);font-weight:400}
.note{font-size:13.5px;color:var(--ink-soft);margin-top:14px;line-height:1.8}
.tag{display:inline-block;background:var(--teal-light);color:var(--ink);
  border-radius:20px;padding:4px 12px;font-size:12.5px;margin:0 6px 8px 0}
.case{font-size:14px;color:var(--ink-soft);padding:10px 0;border-bottom:1px dashed var(--line)}
.case b{color:var(--ink)}
.client{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.client span{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;font-size:13.5px;color:var(--ink)}
.contact p{font-size:15px;color:var(--ink-soft);margin:9px 0;display:flex;gap:12px}
.contact .k{color:var(--teal);min-width:42px;font-weight:400}
footer{text-align:center;font-size:12px;color:var(--teal);letter-spacing:2px;margin-top:26px}
@media(min-width:560px){.scroll{max-width:480px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.08)}}

.qr{display:block;width:128px;height:128px;margin:22px auto 0;border-radius:8px;object-fit:contain}

/* 英文版字号微调：英文比中文长，整体收一档避免溢出 */
html[data-lang="en"] .kicker{font-size:12px;letter-spacing:1.5px;
  overflow-wrap:anywhere;word-break:break-word}
html[data-lang="en"] .poem{font-size:25px;letter-spacing:0;overflow-wrap:anywhere}
html[data-lang="en"] .card .h{font-size:15.5px}
html[data-lang="en"] .card .t{font-size:12px;font-style:normal}
html[data-lang="en"] .card p,
html[data-lang="en"] .note,
html[data-lang="en"] .case{font-size:13px;line-height:1.62}
html[data-lang="en"] .contact .k{min-width:58px}
html[data-lang="en"] .sub{font-size:13.5px;letter-spacing:.5px;
  overflow-wrap:anywhere;word-break:break-word}
</style>
</head>

/* 应用语种：文本用 textContent，含标签的用 data-i18n-html */
function applyLang(lang){
  if(!I18N[lang]) return;
  document.documentElement.setAttribute('data-lang', lang);
  document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
  document.title = lang === 'en'
    ? 'Watson & Band · Cross-Border Legal Services'
    : '华诚 · 涉外法律服务';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = I18N[lang][el.dataset.i18n];
    if(v != null) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const v = I18N[lang][el.dataset.i18nHtml];
    if(v != null) el.innerHTML = v;
  });
  document.querySelectorAll('#lang button').forEach(b=>{
    b.classList.toggle('on', b.dataset.set === lang);
  });
  try{ localStorage.setItem('wb-lang', lang); }catch(e){}
}

/* 初始化：优先取上次选择，其次浏览器语言，默认中文 */
(function init(){
  let saved = null;
  /* 支持 ?lang=en / ?lang=zh 直连分享 */
  const q = new URLSearchParams(location.search).get('lang');
  if(q && I18N[q]) saved = q;
  if(!saved){ try{ saved = localStorage.getItem('wb-lang'); }catch(e){} }
  if(!saved){
    const nav = (navigator.language || 'zh').toLowerCase();
    saved = nav.startsWith('en') ? 'en' : 'zh';
  }
  applyLang(saved);
  document.querySelectorAll('#lang button').forEach(b=>{
    b.onclick = ()=> applyLang(b.dataset.set);
  });
})();

/* 生成右侧导航点 + 进度条 + 高亮 */
const sections=[...document.querySelectorAll('section')];
const nav=document.getElementById('nav');
const bar=document.getElementById('bar');
const scroll=document.getElementById('scroll');
sections.forEach((s,i)=>{
  const a=document.createElement('a');a.href='#';a.dataset.i=i;
  a.onclick=e=>{e.preventDefault();s.scrollIntoView({behavior:'smooth'})};
  nav.appendChild(a);
});
const dots=[...nav.children];
function onScroll(){
  const st=scroll.scrollTop, h=scroll.scrollHeight-scroll.clientHeight;
  bar.style.width=(h>0?st/h*100:0)+'%';
  let idx=0;
  sections.forEach((s,i)=>{if(s.offsetTop-scroll.offsetTop<=st+scroll.clientHeight*0.4)idx=i});
  dots.forEach(d=>d.classList.toggle('on',d.dataset.i===String(idx)));
}
scroll.addEventListener('scroll',onScroll,{passive:true});
onScroll();
</script>
